{% extends "blogs/base.html" %}
{% block content %}
<div class="container-fluid" style="margin-top: 100px;">
    <div class="row">
        <div class="col">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-outline-secondary">Сохранить изменения</button>
                    <a class="btn btn-outline-secondary" href="{% url 'blogs:post_detail' post.pk %}"
                           role="button">Отменить изменения
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
