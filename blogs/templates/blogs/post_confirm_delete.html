{% extends "blogs/base_blogs.html" %}
{% block content %}
<div class="container mt-5 mt-lg-7">
    <div class="row">
        <div class="col-12">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card mt-5">
                    <p class="card-text">Вы действительно хотите удалить {{ object.title }}?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <button type="submit" class="btn  btn-outline-danger">Удалить</button>
                    <a class="btn btn-outline-primary" href="{% url 'blogs:post_list' %}"
                                   role="button">Отменить
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
