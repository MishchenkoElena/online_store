{% extends "blogs/base_blogs.html" %}
{% load blogs_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">Заголовок: {{object.title}}</p>
                        <p class="card-text">Содержание: {{object.content}}</p>
                        <a class="btn btn-sm btn-outline-success" href="{% url 'blogs:post_update' post.pk %}"
                        role="button">Редактировать
                        </a>
                        <a class="btn btn-sm btn-outline-success" href="{% url 'blogs:post_delete' post.pk %}"
                        role="button">Удалить
                        </a>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-sm btn-outline-success" href="{% url 'blogs:post_list' %}"
                                   role="button">Вернуться на главную страницу
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
